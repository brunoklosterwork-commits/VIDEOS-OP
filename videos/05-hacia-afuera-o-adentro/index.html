<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#111}canvas{display:block;width:1080px;height:1920px}</style>
<script type="importmap">{"imports":{"three":"../../motor/vendor/three/three.module.js","three/addons/":"../../motor/vendor/three/examples/jsm/"}}</script>
</head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script type="module">
import { THREE, crearMundo, componer, MAT, clay, caja, esfera, grupo, paredConPuerta, flecha, anillo } from '../../motor/escena3d.js';
import { crearPersonaje } from '../../motor/personaje3d.js';
import { W, H, ease, easeOut, rebote, k, cargarTiempos, subtitulos, dibujarSub, marca, titular, etiqueta } from '../../motor/op.js';

const out = document.getElementById('c'), ctx = out.getContext('2d');
const M = crearMundo(), S = M.scene;
let T, SUBS, F, E, DUR;
async function init() {
  const fr = (await (await fetch('frases.txt')).text()).trim().split('\n');
  T = await cargarTiempos(fr); SUBS = subtitulos(T); F = i => T[i][0]; E = i => T[i][1]; DUR = E(7) + 2.2; window.DUR = DUR;
}

// ---------- decorados ----------
// Local comercial (puerta de vidrio que abre hacia afuera = hacia la cámara)
function local(padre, x) {
  const g = grupo(padre, x, 0, 0);
  const p = paredConPuerta(g, { x0: 0, z0: 0, largo: 6, alto: 2.75, ancho: 1.1, altoP: 2.3, matHoja: clay(0x8fadf6, 0.2, { opacity: 0.7 }), bisagraDer: false });
  caja(g, 6.2, 0.4, 0.5, MAT.blanco, 0, 2.95, 0.1);                       // marquesina
  caja(g, 1.6, 0.12, 0.05, MAT.azul, 0, 2.95, 0.37, 0.03);               // cartel
  for (const xx of [-2.0, 2.0]) caja(g, 1.4, 1.5, 0.06, MAT.vidrio, xx, 1.35, 0.12, 0.02); // vidrieras
  return { g, ...p };
}
// Casa (puerta de entrada que abre hacia adentro = alejándose)
function casa(padre, x) {
  const g = grupo(padre, x, 0, 0);
  const p = paredConPuerta(g, { x0: 0, z0: 0, largo: 5.5, alto: 2.9, ancho: 0.95 });
  caja(g, 5.9, 0.3, 1.2, MAT.blanco, 0, 3.05, -0.3);                     // techo plano
  caja(g, 1.0, 0.9, 0.06, MAT.vidrio, -1.7, 1.5, 0.12, 0.02); caja(g, 1.0, 0.9, 0.06, MAT.vidrio, 1.7, 1.5, 0.12, 0.02);
  caja(g, 7, 0.08, 2.0, MAT.gris, 0, 0.04, 1.4, 0.02);                   // vereda
  return { g, ...p };
}
const gA = grupo(S, 0, 0, 0), L = local(gA, 0);
const gB = grupo(S, 30, 0, 0), C = casa(gB, 0);
// Salida de emergencia con gente
const gC = grupo(S, 60, 0, 0), LC = local(gC, 0);
const flechaC = flecha(gC, [0, -1.6], [0, 2.4], { ancho: 0.16 });
const gente = [];
for (let i = 0; i < 5; i++) {
  const p = crearPersonaje({ colores: { buzo: 0xe4e8f0, buzoClaro: 0xf3f5f9, gorro: 0xf6f3ee, pantalon: 0x9aa1ad } });
  p.raiz.scale.setScalar(0.92); gC.add(p.raiz); gente.push(p);
}
// Casa por dentro: bisagras adentro, vereda libre
const gD = grupo(S, 90, 0, 0), CD = casa(gD, 0);
const anillosD = [0.3, 1.05, 1.8].map(y => { const a = anillo(CD.bisagra, 0.09); a.position.set(0, y, -0.12); return a; });
const libre = new THREE.Mesh(new THREE.PlaneGeometry(2.4, 1.6), clay(0x265ceb, 0.9, { opacity: 0.18 }));
libre.rotation.x = -Math.PI / 2; libre.position.set(0, 0.09, 1.4); gD.add(libre);
// Cierre
const gE = grupo(S, 120, 0, 0), CE = casa(gE, 0);

const P = crearPersonaje(); S.add(P.raiz);
const tomas = [gA, gB, gC, gD, gE];
function toma(t, i, foco, desde, hasta, t0, t1) {
  tomas.forEach((g, j) => g.visible = j === i);
  const c = ease(k(t, t0, t1 - t0));
  M.cam.position.set(foco[0] + desde[0] + (hasta[0] - desde[0]) * c, desde[1] + (hasta[1] - desde[1]) * c, desde[2] + (hasta[2] - desde[2]) * c);
  M.cam.lookAt(foco[0], foco[1], foco[2]);
  M.sol.target.position.set(foco[0], 0, 0); M.sol.position.set(foco[0] - 4, 8, 6);
}
const paso = (t, t0, d) => ease(k(t, t0, d));

function draw(t) {
  P.reset(); P.raiz.visible = true; M.noche(0); let idx;
  const cortes = [0, F(1), F(3), F(5), F(7)]; idx = cortes.filter(c => t >= c).length - 1;
  if (idx === 0) { // negocio: abre hacia afuera, el personaje sale
    toma(t, 0, [0, 1.0, 0], [-2.5, 3.0, 17.5], [-0.8, 2.6, 15.5], 0, F(1));
    L.bisagra.rotation.y = 1.3 * paso(t, 0.4, 0.9);                     // + = hacia la cámara (afuera)
    const sale = paso(t, 0.9, 2.4);
    P.raiz.position.set(0.2 + sale * 1.6, 0, -0.9 + sale * 3.0); P.raiz.rotation.y = 0.5;
    if (sale > 0 && sale < 1) P.caminar(t, 1); P.respirar(t); P.parpadear(t);
  }
  if (idx === 1) { // casa: abre hacia adentro
    toma(t, 1, [30, 0.9, 0], [2.0, 2.8, 15], [0.5, 2.5, 13], F(1), F(3));
    C.bisagra.rotation.y = -1.25 * paso(t, F(1) + 0.3, 0.9);           // - = hacia adentro
    P.raiz.position.set(31.6, 0, 1.6); P.raiz.rotation.y = -0.45;
    if (t > F(2)) P.pensar(paso(t, F(2), 0.4)); else P.señalar(paso(t, F(1) + 0.5, 0.4), -1);
    P.respirar(t); P.parpadear(t);
  }
  if (t >= F(3) && t < F(5)) { // emergencia: la gente sale empujando, la puerta abre hacia afuera
    idx = 2;
    toma(t, 2, [60, 0.9, 0.6], [3.2, 5.6, 17.5], [1.6, 4.8, 15.5], F(3), F(5));
    P.raiz.visible = false;
    const abre = paso(t, F(3) + 0.8, 0.6);
    LC.bisagra.rotation.y = 1.35 * abre;
    flechaC.largo(paso(t, F(3) + 0.4, 0.8));
    gente.forEach((g, i) => {
      g.reset(); const d = Math.max(0, t - F(3) - 0.6 - i * 0.35) * 0.95;
      const z = -1.4 - i * 0.65 + d * 1.35;
      g.raiz.visible = z > -1.3 || abre > 0.5;
      g.raiz.position.set(0 + (i % 2 ? 0.22 : -0.22) * (z > 0.5 ? 2.5 : 1), 0, Math.min(z, 4.5)); g.raiz.rotation.y = 0;
      g.caminar(t + i * 0.3, 1, 0.9); g.parpadear(t + i);
    });
  }
  if (t >= F(5) && t < F(7)) { // casa: bisagras adentro, la puerta no invade la vereda
    idx = 3;
    toma(t, 3, [90, 0.9, 0.3], [-3.0, 3.8, 15], [-1.2, 3.2, 13], F(5), F(7));
    CD.bisagra.rotation.y = -1.25 * paso(t, F(5) + 0.3, 0.9);
    anillosD.forEach((a, i) => { const p = k(t, tercio(F(5), E(5), 0.7) + i * 0.12, 0.4); a.visible = p > 0; a.scale.setScalar(rebote(p) * (1 + Math.sin(t * 6) * 0.06)); });
    libre.visible = t > F(6); libre.material.opacity = 0.22 * paso(t, F(6), 0.5);
    const pasa = paso(t, F(6) + 0.1, 2.0);
    P.raiz.position.set(87.6 + pasa * 4.6, 0, 1.4); P.raiz.rotation.y = Math.PI / 2;
    if (pasa > 0 && pasa < 1) P.caminar(t, 1); P.respirar(t); P.parpadear(t);
  }
  if (t >= F(7)) { // cierre
    idx = 4;
    toma(t, 4, [120, 0.85, 0], [0.8, 2.5, 13], [0, 2.2, 11], F(7), DUR);
    CE.bisagra.rotation.y = -0.4;
    P.raiz.position.set(120.9, 0, 1.4); P.raiz.rotation.y = -0.2;
    P.saludar(t, paso(t, F(7) + 0.1, 0.3)); P.respirar(t); P.parpadear(t);
  }
  componer(ctx, M);
  // ---------- capa 2D ----------
  marca(ctx);
  if (idx === 0) titular(ctx, [['En los negocios:', 0], ['hacia afuera', 1]], t, 0.05);
  else if (idx === 1) {
    if (t < F(2)) titular(ctx, [['En tu casa:', 0], ['hacia adentro', 1]], t, F(1));
    else titular(ctx, [['No es', 0], ['casualidad', 1]], t, F(2));
  } else if (idx === 2) {
    titular(ctx, [['Salida de', 0], ['emergencia', 1]], t, F(3));
    etiqueta(ctx, 70, 1420, 'Se abre hacia afuera', k(t, F(3) + 1.2, 0.5), { acento: true });
    etiqueta(ctx, 70, 1520, 'Nadie queda atrapado', k(t, F(4) + 0.6, 0.5), { acento: true });
  } else if (idx === 3) {
    titular(ctx, [['En tu casa,', 0], ['al revés', 1]], t, F(5));
    etiqueta(ctx, 70, 1420, 'Bisagras del lado de adentro', k(t, tercio(F(5), E(5), 0.7), 0.5), { acento: true });
    etiqueta(ctx, 70, 1520, 'La vereda queda libre', k(t, F(6) + 0.2, 0.5), { acento: true });
  } else {
    titular(ctx, [['Cada puerta tiene', 0], ['su porqué', 1]], t, F(7));
    const q = k(t, E(7) + 0.1, 0.5);
    etiqueta(ctx, 140, 1420, 'Seguinos para más', q, { acento: true, tam: 48 });
    etiqueta(ctx, 140, 1530, 'secretos de tu casa', k(t, E(7) + 0.35, 0.5), { tam: 48 });
  }
  const fl = 1 - k(t, cortes.filter(c => t >= c).pop(), 0.18); if (t > 0.3 && fl > 0) { ctx.fillStyle = `rgba(255,255,255,${fl * 0.6})`; ctx.fillRect(0, 0, W, H); }
  dibujarSub(ctx, SUBS, t, ['negocios', 'afuera', 'casa', 'adentro', 'casualidad', 'emergencia', 'atrapado', 'revés', 'bisagras', 'vereda', 'porqué']);
}
const tercio = (a, b, f) => a + (b - a) * f;
window.ready = init().then(() => document.fonts.load('800 96px "DM Sans"')).then(() => document.fonts.ready);
window.frameJPEG = t => { draw(t); return out.toDataURL('image/jpeg', 0.92); };
</script></body></html>
