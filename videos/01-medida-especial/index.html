<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#111}canvas{display:block;width:1080px;height:1920px}</style>
</head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script type="module">
import { Escena, PAL, fondo, camino } from '../../motor/iso.js';
import { W, H, ease, easeOut, rebote, k, cargarTiempos, subtitulos, dibujarSub, marca, titular, cota, tilde, tarjeta, redondeado, rgb } from '../../motor/op.js';

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const AZ = PAL.acento;
let T, SUBS, F, E, DUR;

async function init() {
  const frases = (await (await fetch('frases.txt')).text()).trim().split('\n');
  T = await cargarTiempos(frases);
  SUBS = subtitulos(T);
  F = i => T[i][0]; E = i => T[i][1];
  DUR = E(8) + 1.0; window.DUR = DUR;
}

// ---------- tomas ----------
function tomaA_B(t) { // pared con hueco: la estándar no entra / la de OP se hace a medida
  const e = new Escena(ctx, { escala: 150, ox: 470, oy: 1020 });
  e.caja(-3, -2, -0.4, 11, 9, 0.4, { suelo: true });
  const crece = rebote(k(t, F(2) + 0.25, 0.9));
  const hp = 3.0 * easeOut(k(t, 0, 0.5)); // la pared sube al empezar
  e.caja(-1.2, 0, 0, 2.8, 0.3, hp);
  e.caja(2.6, 0, 0, 2.6, 0.3, hp);
  if (hp > 2.5) e.caja(1.6, 0, 2.5, 1.0, 0.3, hp - 2.5);
  // la puerta: entra de frente, no alcanza, tiembla; después se agranda
  const entra = rebote(k(t, 0.35, 0.8));
  const tiembla = Math.sin(t * 40) * 0.025 * Math.exp(-Math.max(0, t - F(1)) * 4) * (t > F(1) ? 1 : 0);
  const w = 0.7 + 0.3 * crece, h = 2.0 + 0.5 * crece;
  const x0 = 2.1 - w / 2 + tiembla, y0 = 0.12 + (1 - entra) * 3.2;
  e.caja(x0, y0, 0, w, 0.07, h, { color: AZ, brillo: 0.03 });
  e.caja(x0 + w * 0.82, y0 + 0.07, h * 0.45, 0.06, 0.06, 0.12, { color: [230, 236, 248] }); // manija
  // ambiente
  e.caja(3.4, 1.4, 0, 1.4, 0.6, 0.9 * easeOut(k(t, 0.2, 0.5)));
  e.esfera(-0.4, 1.6, 0, 0.35 * easeOut(k(t, 0.3, 0.5)), { color: [222, 229, 243] });
  e.dibujar();
  // hueco marcado (escena A)
  const marcaHueco = k(t, F(1), 0.4) * (1 - k(t, F(2), 0.3));
  if (marcaHueco > 0) {
    const P = [[1.6, 0.3, 0], [1.6, 0.3, 2.5], [2.6, 0.3, 2.5], [2.6, 0.3, 0]].map(q => e.p(...q));
    ctx.save(); ctx.globalAlpha = marcaHueco; ctx.setLineDash([18, 14]); ctx.lineDashOffset = -t * 60;
    ctx.strokeStyle = rgb(AZ); ctx.lineWidth = 6; ctx.beginPath(); P.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.stroke();
    ctx.restore();
  }
  // cotas (escena B)
  cota(ctx, e.p(2.95, 0.3, 0), e.p(2.95, 0.3, 2.5), '2,50 m', ease(k(t, F(3) + 0.1, 0.7)), 'der');
  cota(ctx, e.p(1.6, 0.9, 0), e.p(2.6, 0.9, 0), '1 m', ease(k(t, F(3) + (E(3) - F(3)) * 0.6, 0.6)), 'izq');
  if (t < F(2)) titular(ctx, [['¿Medida', 0], ['especial?', 1]], t, 0.1);
  else titular(ctx, [['Puertas', 0], ['a medida', 1]], t, F(2));
}

function tomaC(t) { // de taller a casa, checklist
  const t0 = F(4);
  const e = new Escena(ctx, { escala: 60, ox: 430, oy: 880 });
  e.caja(-2, -2, -0.4, 16, 15, 0.4, { suelo: true });
  e.caja(-2, 8.6, 0, 16, 1.2, 0.05, { suelo: true });
  const s1 = easeOut(k(t, t0, 0.5)), s2 = easeOut(k(t, t0 + 0.15, 0.5));
  // taller
  e.caja(0, 0, 0, 4.6, 3.4, 2.4 * s1);
  for (let i = 0; i < 3; i++) e.caja(0.3 + i * 1.45, 0.4, 2.4 * s1, 1.2, 2.6, 0.45 * s1);
  e.caja(4.6, 1.1, 0, 0.06, 1.3, 1.6 * s1, { color: [200, 207, 222] }); // portón
  // casa
  e.caja(8.2, 4.6, 0, 3.6, 3.0, 2.0 * s2);
  e.caja(8.0, 4.4, 2.0 * s2, 4.0, 3.4, 0.25 * s2);
  e.caja(9.4, 7.6, 0, 0.9, 0.06, 1.5 * s2, { color: AZ }); // su puerta, azul
  for (const [x, y, r] of [[-1, 6, 0.6], [6.4, 0, 0.55], [12.6, 2.6, 0.6], [2.8, 10.6, 0.5]]) {
    const q = easeOut(k(t, t0 + 0.3, 0.5)); e.esfera(x, y, 0.4 * q, r * q, { color: [222, 229, 243] });
  }
  // la puerta viaja por el camino
  const ruta = [[5.3, 1.75], [6.6, 1.75], [6.6, 8.2], [9.85, 8.2]];
  const pv = ease(k(t, t0 + 0.6, (E(5) - t0) - 0.4));
  const [px, py] = enRuta(ruta, pv), [qx, qy] = enRuta(ruta, Math.min(1, pv + 0.01));
  const enX = Math.abs(qx - px) >= Math.abs(qy - py); // la hoja viaja de canto, alineada al camino
  if (pv > 0 && pv < 0.995) {
    if (enX) e.caja(px - 0.45, py - 0.06, 0.05, 0.9, 0.12, 1.6, { color: AZ, brillo: 0.05 });
    else e.caja(px - 0.06, py - 0.45, 0.05, 0.12, 0.9, 1.6, { color: AZ, brillo: 0.05 });
  }
  e.dibujar(() => camino(e, ruta, pv));
  titular(ctx, [['Te llega', 0], ['lista', 1]], t, t0);
  // checklist
  const c = easeOut(k(t, t0 + 0.2, 0.5));
  ctx.save(); ctx.globalAlpha = c; ctx.translate(0, (1 - c) * 50);
  tarjeta(ctx, 470, 470, 560, 330, (g) => {
    const items = [['Nos pasás las medidas', t0 + 0.3], ['La fabricamos', t0 + (E(4) - t0) * 0.7], ['Herrajes incluidos', F(5) + (E(5) - F(5)) * 0.65]];
    items.forEach(([txt, tt], i) => {
      const p = ease(k(t, tt, 0.35));
      tilde(g, 62, 72 + i * 94, 28, p);
      g.font = `${p > 0 ? 700 : 500} 36px "DM Sans"`; g.fillStyle = p > 0 ? PAL.tinta : PAL.tintaSuave; g.textBaseline = 'middle';
      g.fillText(txt, 110, 74 + i * 94);
    });
  });
  ctx.restore();
}
function enRuta(R, p) {
  const L = []; let tot = 0; for (let i = 1; i < R.length; i++) { const l = Math.hypot(R[i][0] - R[i - 1][0], R[i][1] - R[i - 1][1]); L.push(l); tot += l; }
  let d = p * tot; for (let i = 0; i < L.length; i++) { if (d <= L[i]) { const f = d / L[i]; return [R[i][0] + (R[i + 1][0] - R[i][0]) * f, R[i][1] + (R[i + 1][1] - R[i][1]) * f]; } d -= L[i]; }
  return R[R.length - 1];
}

function tomaD(t) { // instalación en 15 minutos
  const t0 = F(6), fin = E(6);
  const e = new Escena(ctx, { escala: 80, ox: 520, oy: 860 });
  e.caja(-2, -2, -0.5, 12, 11, 0.5, { suelo: true });
  e.caja(0, 0, 0, 7, 6, 0.15, { suelo: true });
  const HW = 3.1, Tt = 0.28, s = easeOut(k(t, t0, 0.45));
  e.caja(0, 0, 0.15, Tt, 6, HW * s);
  e.caja(Tt, 0, 0.15, 2.0, Tt, HW * s);
  e.caja(Tt + 3.35, 0, 0.15, 7 - Tt - 3.35, Tt, HW * s);
  if (s > 0.85) e.caja(Tt + 2.0, 0, 2.7, 1.35, Tt, HW * s - 2.55);
  // marco + hoja: la hoja baja y entra en su lugar, después se abre
  const coloca = rebote(k(t, t0 + 0.5, 0.9));
  const fr = { color: AZ };
  if (coloca > 0) {
    e.caja(Tt + 2.0, -0.02, 0.15, 0.09, Tt + 0.04, 2.55, fr);
    e.caja(Tt + 3.26, -0.02, 0.15, 0.09, Tt + 0.04, 2.55, fr);
    e.caja(Tt + 2.0, -0.02, 2.62, 1.35, Tt + 0.04, 0.08, fr);
  }
  const abre = ease(k(t, fin - 0.6, 1.0)) * 1.0;
  if (coloca > 0) e.cajaRot(Tt + 2.09, Tt, 0.17 + (1 - coloca) * 2.5, 1.17, 0.09, 2.44, abre, { color: AZ, brillo: 0.04 });
  e.caja(4.4, 0.8, 0.15, 2.2, 0.9, 0.55 * s); e.caja(4.4, 0.6, 0.15, 2.2, 0.3, 1.15 * s);
  e.caja(4.6, 2.4, 0.15, 1.4, 0.9, 0.45 * s); e.caja(0.6, 4.3, 0.15, 1.6, 1.2, 0.8 * s);
  e.dibujar();
  titular(ctx, [['Instalada en', 0], ['15 minutos', 1]], t, t0);
  const c = easeOut(k(t, t0 + 0.2, 0.5));
  ctx.save(); ctx.globalAlpha = c; ctx.translate(0, (1 - c) * 40);
  tarjeta(ctx, 620, 1330, 380, 230, (g, w) => {
    g.fillStyle = PAL.tintaSuave; g.font = '500 32px "DM Sans"'; g.fillText('Instalación', 36, 60);
    const pr = ease(k(t, t0 + 0.4, fin - t0 - 0.2)), seg = Math.round(pr * 900);
    g.fillStyle = PAL.tinta; g.font = '800 84px "DM Sans"';
    g.fillText(`${String(Math.floor(seg / 60)).padStart(2, '0')}:${String(seg % 60).padStart(2, '0')}`, 36, 152);
    redondeado(g, 36, 182, w - 72, 14, 7); g.fillStyle = '#e8ecf4'; g.fill();
    redondeado(g, 36, 182, (w - 72) * Math.max(0.04, pr), 14, 7); g.fillStyle = rgb(AZ); g.fill();
  });
  ctx.restore();
}

function tomaE(t) { // cierre: presupuesto + descuento
  const t0 = F(7);
  const e = new Escena(ctx, { escala: 120, ox: 540, oy: 1000 });
  e.caja(-4, -4, -0.4, 10, 10, 0.4, { suelo: true });
  const s = easeOut(k(t, t0, 0.4));
  e.caja(-0.9, -0.9, 0, 1.8, 1.8, 0.25 * s, { suelo: true });
  const gira = 0.35 + Math.sin(t * 0.8) * 0.06;
  if (s > 0.5) e.cajaRot(-0.5, 0.1, 0.25, 1.0, 0.07, 2.5 * rebote(k(t, t0 + 0.1, 0.8)), -gira, { color: AZ, brillo: 0.04 });
  // pila de 5 puertas que aparece con "cinco"
  for (let i = 0; i < 5; i++) {
    const q = rebote(k(t, F(8) + 0.35 + i * 0.12, 0.5));
    if (q > 0) e.caja(1.6, 0.4, 0.02 + i * 0.09 + (1 - q) * 1.5, 1.0, 2.5, 0.07, { color: i % 2 ? [235, 239, 247] : AZ });
  }
  e.dibujar();
  titular(ctx, [['Pedí tu', 0], ['presupuesto', 1]], t, t0);
  // tarjeta WhatsApp
  const c = easeOut(k(t, t0 + 0.3, 0.5));
  ctx.save(); ctx.globalAlpha = c; ctx.translate(0, (1 - c) * 40);
  tarjeta(ctx, 80, 1300, 600, 190, (g) => {
    g.beginPath(); g.arc(80, 95, 46, 0, 7); g.fillStyle = rgb(AZ); g.fill();
    g.strokeStyle = '#fff'; g.lineWidth = 7; g.beginPath(); g.arc(80, 95, 22, Math.PI * 0.75, Math.PI * 2.55); g.stroke();
    g.fillStyle = PAL.tintaSuave; g.font = '500 32px "DM Sans"'; g.fillText('Escribinos tus medidas', 150, 80);
    g.fillStyle = PAL.tinta; g.font = '800 44px "DM Sans"'; g.fillText('3476 305096', 150, 132);
  });
  ctx.restore();
  // pastilla descuento
  const d = rebote(k(t, F(8) + (E(8) - F(8)) * 0.7, 0.5));
  if (d > 0) {
    ctx.save(); ctx.translate(800, 1180); ctx.scale(d, d); ctx.rotate(-0.06);
    ctx.font = '800 50px "DM Sans"'; const tx = '+5 puertas: descuento', tw = ctx.measureText(tx).width + 60;
    ctx.shadowColor = 'rgba(38,92,235,0.4)'; ctx.shadowBlur = 40; ctx.shadowOffsetY = 14;
    redondeado(ctx, -tw / 2 - 40, -50, tw, 100, 50); ctx.fillStyle = rgb(AZ); ctx.fill(); ctx.shadowColor = 'transparent';
    ctx.fillStyle = '#fff'; ctx.textBaseline = 'middle'; ctx.fillText(tx, -tw / 2 - 10, 2);
    ctx.restore();
  }
}

// ---------- montaje ----------
function draw(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, W, H);
  const cortes = [0, F(4), F(6), F(7)], idx = cortes.filter(c => t >= c).length - 1, tc = cortes[idx];
  // entrada de cada toma: leve zoom
  const z = 1 + 0.05 * (1 - easeOut(k(t, tc, 0.4)));
  fondo(ctx, W, H);
  ctx.save(); ctx.translate(W / 2, H / 2); ctx.scale(z, z); ctx.translate(-W / 2, -H / 2);
  [tomaA_B, tomaC, tomaD, tomaE][idx](t);
  ctx.restore();
  const fl = 1 - k(t, tc, 0.18);
  if (idx > 0 && fl > 0) { ctx.fillStyle = `rgba(255,255,255,${fl * 0.6})`; ctx.fillRect(0, 0, W, H); }
  marca(ctx);
  dibujarSub(ctx, SUBS, t, ['medida', '2,50', '1', '15', 'herrajes', 'presupuesto', '5', 'descuento']);
}

window.ready = init().then(() => document.fonts.load('800 96px "DM Sans"')).then(() => document.fonts.ready);
window.frameJPEG = t => { draw(t); return cv.toDataURL('image/jpeg', 0.92); };
</script></body></html>
