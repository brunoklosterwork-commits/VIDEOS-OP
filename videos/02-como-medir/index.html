<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#111}canvas{display:block;width:1080px;height:1920px}</style>
</head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script type="module">
import { Escena, PAL, fondo } from '../../motor/iso.js';
import { camara, W, H, ease, easeOut, rebote, k, cargarTiempos, subtitulos, dibujarSub, marca, titular, cotaEn, etiqueta, montar, tilde, tarjeta, redondeado, rgb } from '../../motor/op.js';

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const AZ = PAL.acento;
let T, SUBS, F, E, DUR;
async function init() {
  const frases = (await (await fetch('frases.txt')).text()).trim().split('\n');
  T = await cargarTiempos(frases); SUBS = subtitulos(T);
  F = i => T[i][0]; E = i => T[i][1]; DUR = E(10) + 1.0; window.DUR = DUR;
}

// hueco: x 1.5..2.32 (0,82 m), alto 2,05 m
const OX = 1.5, OW = 0.82, OH = 2.05;
function hueco(e, alfa = 1, T0 = 0.3) { // tinte azul suave para que el hueco se lea
  if (alfa <= 0) return;
  const P = [[OX, T0 / 2, 0], [OX, T0 / 2, OH], [OX + OW, T0 / 2, OH], [OX + OW, T0 / 2, 0]].map(q => e.p(...q));
  ctx.save(); ctx.globalAlpha = alfa;
  ctx.beginPath(); P.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.closePath();
  ctx.fillStyle = 'rgba(38,92,235,0.13)'; ctx.fill();
  ctx.setLineDash([14, 10]); ctx.strokeStyle = 'rgba(38,92,235,0.55)'; ctx.lineWidth = 4; ctx.stroke();
  ctx.restore();
}
function pared(e, hp, T0 = 0.3) {
  e.caja(-1.5, 0, 0, 3.0, T0, hp);
  e.caja(OX + OW, 0, 0, 2.7, T0, hp);
  if (hp > OH) e.caja(OX, 0, OH, OW, T0, hp - OH);
}

// ---------- toma A: el hueco, ancho y alto ----------
function tomaA(t) {
  const e = new Escena(ctx, camara(t, 0, F(7), { escala: 140, ox: 440, oy: 980 }, { zoom: 0.08, dx: -60, piv: [560, 800] }));
  e.caja(-4, -2, -0.4, 12, 9, 0.4, { suelo: true });
  pared(e, 3.0 * easeOut(k(t, 0, 0.5)));
  e.caja(3.3, 1.3, 0, 1.2, 0.55, 0.85 * easeOut(k(t, 0.15, 0.5)));
  e.esfera(-0.8, 1.5, 0, 0.32 * easeOut(k(t, 0.25, 0.5)), { color: [222, 229, 243] });
  e.dibujar();
  hueco(e, k(t, 0.5, 0.4));
  const Y = 0.3;
  // una sola medida (el error)
  const una = ease(k(t, F(1) + 0.2, 0.6)) * (1 - k(t, F(2), 0.3));
  if (una > 0) cotaEn(ctx, e.p(OX, Y, 1.0), e.p(OX + OW, Y, 1.0), '¿una sola?', una, [e.p(OX + OW, Y, 1.0)[0] + 50, e.p(OX + OW, Y, 1.0)[1] - 130]);
  // ancho: arriba, medio, abajo
  const anchos = [[1.85, '0,82 m'], [1.0, '0,83 m'], [0.2, '0,81 m']];
  const dA = (E(3) - F(3)) / 3, fueraA = 1 - k(t, F(5), 0.35);
  anchos.forEach(([z, txt], i) => {
    const p = ease(k(t, F(3) + i * dA, 0.5));
    if (p <= 0 || fueraA <= 0) return;
    const elegida = i === 2, chica = k(t, F(4) + 0.2, 0.3);
    const alfa = fueraA * (elegida ? 1 : 1 - 0.75 * chica);
    const b = e.p(OX + OW, Y, z);
    cotaEn(ctx, e.p(OX, Y, z), b, txt, p, [b[0] + 60, b[1] - 60 - i * 10], { alfa, ok: elegida && chica > 0.5 });
  });
  // alto: izquierda, centro, derecha
  const altos = [[OX + 0.08, '2,05 m'], [OX + OW / 2, '2,04 m'], [OX + OW - 0.08, '2,06 m']];
  const dH = (E(6) - F(6)) / 3;
  altos.forEach(([x, txt], i) => {
    const p = ease(k(t, F(6) + i * dH, 0.5));
    if (p <= 0) return;
    const elegida = i === 1, chica = k(t, E(6) - 0.1, 0.3);
    const alfa = (1 - k(t, F(7), 0.2)) * (elegida ? 1 : 1 - 0.75 * chica);
    const lp = [100 + i * 290, 600];
    cotaEn(ctx, e.p(x, Y, 0), e.p(x, Y, OH), txt, p, lp, { alfa, ok: elegida && chica > 0.5 });
  });
  if (t < F(1)) titular(ctx, [['¿Vas a cambiar', 0], ['una puerta?', 1]], t, 0.05);
  else if (t < F(2)) titular(ctx, [['Error común:', 0], ['medir 1 vez', 1]], t, F(1));
  else if (t < F(5)) titular(ctx, [['Ancho:', 0], ['3 medidas', 1]], t, F(2));
  else titular(ctx, [['Alto:', 0], ['3 medidas', 1]], t, F(5));
}

// ---------- toma B: espesor y marco ----------
function tomaB(t) {
  const t0 = F(7), TT = 0.45;
  const e = new Escena(ctx, camara(t, t0, F(9), { escala: 230, ox: 246, oy: 960 }, { zoom: 0.07, dx: 50, piv: [520, 900] }));
  e.caja(-3, -2, -0.4, 9, 6, 0.4, { suelo: true });
  const s = easeOut(k(t, t0, 0.4));
  e.caja(-1.5, 0, 0, 3.0, TT, 2.6 * s);
  e.caja(OX + OW, 0, 0, 2.0, TT, 2.6 * s);
  if (s > 0.8) e.caja(OX, 0, OH, OW, TT, (2.6 - OH) * s);
  // marco azul que baja y envuelve el espesor
  const m = rebote(k(t, F(8) + 0.15, 0.8));
  if (m > 0) {
    const dz = (1 - m) * 1.6, o = { color: AZ, prof: 40 };
    e.caja(OX, -0.04, dz, 0.07, TT + 0.08, OH, o);
    e.caja(OX + OW - 0.07, -0.04, dz, 0.07, TT + 0.08, OH, { ...o, prof: 39 });
    e.caja(OX, -0.04, OH - 0.07 + dz, OW, TT + 0.08, 0.07, { ...o, prof: 41 });
  }
  e.dibujar();
  const pe = ease(k(t, t0 + 0.3, 0.6)) * (1 - 0.7 * k(t, F(8) + 0.4, 0.4));
  const a = e.p(OX, 0, 1.2), b = e.p(OX, TT, 1.2);
  cotaEn(ctx, a, b, 'espesor', pe, [b[0] + 120, b[1] - 20]);
  if (t < F(8)) titular(ctx, [['Espesor', 0], ['de la pared', 1]], t, t0);
  else titular(ctx, [['Define', 0], ['el marco', 1]], t, F(8));
}

// ---------- toma C: entra a la primera + guardalo ----------
function tomaC(t) {
  const t0 = F(9);
  const e = new Escena(ctx, camara(t, t0, DUR, { escala: 140, ox: 440, oy: 980 }, { zoom: 0.06, dx: 60, piv: [560, 820] }));
  e.caja(-4, -2, -0.4, 12, 9, 0.4, { suelo: true });
  pared(e, 3.0 * easeOut(k(t, t0, 0.4)));
  const entra = rebote(k(t, t0 + 0.4, 0.9));
  if (entra > 0) {
    const y0 = 0.1 + (1 - entra) * 3;
    e.caja(OX, y0, 0, OW, 0.07, OH, { color: AZ, brillo: 0.03, prof: 50 });
    e.caja(OX + OW * 0.82, y0 + 0.07, OH * 0.45, 0.06, 0.06, 0.12, { color: [230, 236, 248], prof: 51 });
  }
  e.caja(3.3, 1.3, 0, 1.2, 0.55, 0.85);
  e.dibujar();
  hueco(e, 1 - k(t, t0 + 0.9, 0.3));
  if (t < F(10)) titular(ctx, [['Entra a', 0], ['la primera', 1]], t, t0);
  else titular(ctx, [['Guardá', 0], ['este video', 1]], t, F(10));
  const c = easeOut(k(t, t0 + 0.15, 0.45));
  ctx.save(); ctx.globalAlpha = c; ctx.translate(0, (1 - c) * 40);
  tarjeta(ctx, 560, 470, 440, 300, (g) => {
    [['Ancho (×3)', 0.3], ['Alto (×3)', 0.6], ['Espesor', 0.9]].forEach(([txt, d], i) => {
      const p = ease(k(t, t0 + d, 0.3));
      tilde(g, 60, 66 + i * 86, 26, p);
      g.font = '700 38px "DM Sans"'; g.fillStyle = PAL.tinta; g.textBaseline = 'middle'; g.fillText(txt, 104, 68 + i * 86);
    });
  });
  ctx.restore();
  // marcador "guardar"
  const g = rebote(k(t, F(10) + 0.3, 0.6));
  if (g > 0) {
    ctx.save(); ctx.translate(540, 1530); ctx.scale(g, g);
    ctx.shadowColor = 'rgba(38,92,235,0.4)'; ctx.shadowBlur = 40; ctx.shadowOffsetY = 14;
    ctx.beginPath(); ctx.moveTo(-60, -80); ctx.lineTo(60, -80); ctx.lineTo(60, 80); ctx.lineTo(0, 40); ctx.lineTo(-60, 80); ctx.closePath();
    ctx.fillStyle = rgb(AZ); ctx.fill(); ctx.restore();
  }
}

function draw(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, W, H);
  fondo(ctx, W, H);
  montar(ctx, t, [0, F(7), F(9)], [tomaA, tomaB, tomaC]);
  marca(ctx);
  dibujarSub(ctx, SUBS, t, ['puerta', 'error', 'sola', 'ancho', 'tres', '3', 'chica', 'alto', 'espesor', 'marco', 'primera', 'guardá']);
}
window.ready = init().then(() => document.fonts.load('800 96px "DM Sans"')).then(() => document.fonts.ready);
window.frameJPEG = t => { draw(t); return cv.toDataURL('image/jpeg', 0.92); };
</script></body></html>
