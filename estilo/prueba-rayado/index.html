<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#111}canvas{display:block;width:1080px;height:1920px}</style>
</head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script type="module">
// Prueba de estilo "plumilla": todo se dibuja con líneas paralelas que se trazan en vivo.
const W = 1080, H = 1920, cv = document.getElementById('c'), ctx = cv.getContext('2d');
const PAPEL = '#e8e3d6', TINTA = '#2a2826', AZUL = '#2456d6';
const ease = t => t <= 0 ? 0 : t >= 1 ? 1 : t * t * (3 - 2 * t);
const k = (t, a, d) => Math.max(0, Math.min(1, (t - a) / d));
function rnd(s) { const x = Math.sin(s * 127.1) * 43758.5453; return x - Math.floor(x); }

// rayado: líneas paralelas a 'ang' dentro de 'forma' (función que arma el path); prog 0..1 las va trazando
function rayar(forma, ang, sep, { prog = 1, ancho = 2.2, color = TINTA, semilla = 1, curva = 0 } = {}) {
  if (prog <= 0) return;
  ctx.save(); ctx.beginPath(); forma(ctx); ctx.clip();
  const c = Math.cos(ang), s = Math.sin(ang), L = 2400, n = Math.ceil(2400 / sep);
  ctx.strokeStyle = color; ctx.lineWidth = ancho; ctx.lineCap = 'round';
  for (let i = 0; i < n; i++) {
    const p = Math.max(0, Math.min(1, prog * 1.6 - (i / n) * 0.6)); // escalonado
    if (p <= 0) continue;
    const d = -1200 + i * sep + (rnd(i + semilla) - 0.5) * sep * 0.25;
    const cx = W / 2 - s * d, cy = H / 2 + c * d;
    const x0 = cx - c * L / 2, y0 = cy - s * L / 2;
    ctx.beginPath(); ctx.moveTo(x0, y0);
    if (curva) ctx.quadraticCurveTo(cx + s * curva, cy - c * curva, x0 + c * L * p, y0 + s * L * p);
    else ctx.lineTo(x0 + c * L * p, y0 + s * L * p);
    ctx.stroke();
  }
  ctx.restore();
}
function contorno(forma, { prog = 1, ancho = 4, color = TINTA } = {}) {
  if (prog <= 0) return;
  ctx.save(); ctx.beginPath(); forma(ctx); ctx.strokeStyle = color; ctx.lineWidth = ancho; ctx.lineJoin = 'round';
  ctx.setLineDash([4000 * prog, 4000]); ctx.stroke(); ctx.restore();
}
const rect = (x, y, w, h) => c => c.rect(x, y, w, h);

function draw(t) {
  ctx.fillStyle = PAPEL; ctx.fillRect(0, 0, W, H);
  // cielo: horizontales finas
  rayar(rect(0, 380, W, 520), 0, 14, { prog: ease(k(t, 0, 1.0)), ancho: 1.6, semilla: 3 });
  // pared: diagonales
  const pared = c => { c.rect(90, 560, 900, 760); };
  rayar(pared, -0.62, 15, { prog: ease(k(t, 0.3, 1.0)), semilla: 7 });
  // vano de la ventana (blanco de papel): lo "borramos" pintando papel
  const VX = 190, VY = 680, VW = 700, VH = 480;
  ctx.fillStyle = PAPEL; ctx.fillRect(VX - 10, VY - 10, VW + 20, VH + 20);
  // sombra del vano (rayado denso arriba e izquierda)
  rayar(c => { c.moveTo(VX, VY); c.lineTo(VX + VW, VY); c.lineTo(VX + VW - 40, VY + 40); c.lineTo(VX + 40, VY + 40); c.lineTo(VX + 40, VY + VH - 40); c.lineTo(VX, VY + VH); c.closePath(); },
    Math.PI / 2, 7, { prog: ease(k(t, 0.8, 0.6)), semilla: 11 });
  // marco de aluminio
  const mp = ease(k(t, 1.0, 0.8));
  contorno(rect(VX + 40, VY + 40, VW - 80, VH - 80), { prog: mp, ancho: 6 });
  // dos hojas corredizas; la derecha se desliza
  const abre = ease(k(t, 2.4, 1.2)) * 200;
  const HY = VY + 52, HH = VH - 104, HW = (VW - 104) / 2 + 20;
  const hoja = (x) => c => c.rect(x, HY, HW, HH);
  for (const [x, sem] of [[VX + 52, 21], [VX + 52 + HW - 40 - abre, 33]]) {
    if (mp > 0.3) { ctx.fillStyle = PAPEL; ctx.fillRect(x, HY, HW, HH); }  // la hoja tapa lo de atrás
    contorno(hoja(x), { prog: mp, ancho: 5 });
    // vidrio: verticales espaciadas + un reflejo diagonal
    rayar(c => c.rect(x + 18, HY + 18, HW - 36, HH - 36), Math.PI / 2, 26, { prog: ease(k(t, 1.4, 0.8)), ancho: 1.4, semilla: sem });
    rayar(c => { c.moveTo(x + 40, HY + HH - 40); c.lineTo(x + 140, HY + 30); c.lineTo(x + 180, HY + 30); c.lineTo(x + 80, HY + HH - 40); c.closePath(); },
      -1.2, 9, { prog: ease(k(t, 1.6, 0.6)), ancho: 1.4, color: PAPEL, semilla: sem + 1 });
  }
  // la rueda (accesorio): círculo azul que aparece abajo de la hoja
  const r = ease(k(t, 3.4, 0.5));
  if (r > 0) {
    const rx = VX + 52 + HW - 40 - abre + HW / 2, ry = HY + HH + 4;
    ctx.save(); ctx.strokeStyle = AZUL; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.arc(rx, ry, 34 * r, 0, 7); ctx.stroke();
    ctx.beginPath(); ctx.arc(rx, ry, 70 * r, 0, Math.PI * 2 * r); ctx.stroke();
    ctx.restore();
    rayar(c => c.arc(rx, ry, 34 * r, 0, 7), 0.8, 7, { prog: r, ancho: 2, color: AZUL, semilla: 41 });
    ctx.save(); ctx.globalAlpha = k(t, 3.7, 0.3); ctx.font = '700 44px "DM Sans"';
    const tx = 'rueda con rulemán', tw = ctx.measureText(tx).width;
    ctx.fillStyle = PAPEL; ctx.fillRect(rx - tw / 2 - 24, ry + 92, tw + 48, 70);
    ctx.strokeStyle = AZUL; ctx.lineWidth = 3; ctx.strokeRect(rx - tw / 2 - 24, ry + 92, tw + 48, 70);
    ctx.beginPath(); ctx.moveTo(rx, ry + 70); ctx.lineTo(rx, ry + 92); ctx.stroke();
    ctx.fillStyle = AZUL; ctx.textAlign = 'center'; ctx.fillText(tx, rx, ry + 142); ctx.restore();
  }
  // suelo: curvas
  rayar(rect(0, 1320, W, 600), 0.08, 18, { prog: ease(k(t, 0.5, 1.2)), semilla: 51, curva: 140 });
  // ciprés a la izquierda: verticales
  const cipres = c => { c.ellipse(70, 700, 70, 420, 0, 0, 7); };
  ctx.fillStyle = PAPEL; ctx.beginPath(); cipres(ctx); ctx.fill();
  rayar(cipres, Math.PI / 2, 9, { prog: ease(k(t, 0.6, 1.0)), semilla: 61 });
  // titular
  const q = ease(k(t, 0.2, 0.6));
  ctx.save(); ctx.globalAlpha = q; ctx.fillStyle = TINTA; ctx.font = '800 92px "DM Sans"';
  ctx.fillText('Dos ventanas', 80, 200 + (1 - q) * 30);
  ctx.fillStyle = AZUL; ctx.fillText('iguales…', 80, 300 + (1 - q) * 30);
  ctx.restore();
  // subtítulo (tercio inferior)
  ctx.save(); ctx.font = '800 64px "DM Sans"'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  const sub = t < 2.4 ? 'iguales por fuera' : 'lo que no se ve';
  if (t < 3.3)
  { ctx.strokeStyle = PAPEL; ctx.lineWidth = 18; ctx.strokeText(sub, W / 2, 1280);
  ctx.fillStyle = TINTA; ctx.fillText(sub, W / 2, 1280); } ctx.restore();
}
window.ready = document.fonts.load('800 92px "DM Sans"').then(() => document.fonts.ready);
window.frameJPEG = t => { draw(t); return cv.toDataURL('image/jpeg', 0.92); };
</script></body></html>
