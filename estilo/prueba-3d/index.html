<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#111}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"../../motor/vendor/three/three.module.js","three/addons/":"../../motor/vendor/three/examples/jsm/"}}</script>
</head><body>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { crearPersonaje } from '../../motor/personaje3d.js';

const W = 1080, H = 1920;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H); renderer.setPixelRatio(1);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.NeutralToneMapping; renderer.toneMappingExposure = 1.0;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xeef1f6);
scene.fog = new THREE.Fog(0xeef1f6, 9, 22);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.55;

// luz: una principal suave arriba-izquierda + relleno de cielo
const hemi = new THREE.HemisphereLight(0xffffff, 0xcfd6e4, 0.75); scene.add(hemi);
const sol = new THREE.DirectionalLight(0xffffff, 2.6);
sol.position.set(-4, 7, 5); sol.castShadow = true;
sol.shadow.mapSize.set(2048, 2048); sol.shadow.radius = 9; sol.shadow.blurSamples = 20; sol.shadow.bias = -0.0004;
Object.assign(sol.shadow.camera, { left: -5, right: 5, top: 5, bottom: -5, near: 1, far: 20 });
scene.add(sol);

const clay = (c, r = 0.85) => new THREE.MeshPhysicalMaterial({ color: c, roughness: r, sheen: 0.3, sheenRoughness: 0.9 });
const BLANCO = clay(0xf6f7fa), AZUL = clay(0x265ceb, 0.6);
function caja(w, h, d, m, x, y, z, r = 0.04) {
  const me = new THREE.Mesh(new RoundedBoxGeometry(w, h, d, 4, r), m);
  me.position.set(x, y, z); me.castShadow = me.receiveShadow = true; scene.add(me); return me;
}
// piso
const piso = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), clay(0xf1f3f7, 0.95));
piso.rotation.x = -Math.PI / 2; piso.receiveShadow = true; scene.add(piso);
// pared con hueco y puerta azul
caja(2.2, 2.8, 0.25, BLANCO, -1.6, 1.4, -1.2);
caja(2.2, 2.8, 0.25, BLANCO, 1.6, 1.4, -1.2);
caja(1.0, 0.5, 0.25, BLANCO, 0, 2.55, -1.2);
const bisagra = new THREE.Group(); bisagra.position.set(-0.48, 0, -1.2); scene.add(bisagra);
const hoja = new THREE.Mesh(new RoundedBoxGeometry(0.94, 2.26, 0.06, 4, 0.02), AZUL);
hoja.position.set(0.47, 1.14, 0); hoja.castShadow = hoja.receiveShadow = true; bisagra.add(hoja);
const manija = new THREE.Mesh(new THREE.SphereGeometry(0.035, 16, 16), clay(0xe8edf7, 0.4)); manija.position.set(0.8, 1.05, 0.06); bisagra.add(manija);
// mobiliario y detalles
caja(0.9, 0.75, 0.5, BLANCO, 2.3, 0.375, 0.2);
const planta = new THREE.Mesh(new THREE.SphereGeometry(0.32, 32, 32), clay(0xdfe6f4)); planta.position.set(-2.4, 0.75, -0.3); planta.castShadow = true; scene.add(planta);
caja(0.36, 0.42, 0.36, BLANCO, -2.4, 0.21, -0.3, 0.06);
// tarjetas flotantes (UI)
const tarjetas = [];
for (const [x, y, z] of [[1.55, 2.4, -0.4], [-1.65, 2.1, 0.1]]) {
  const g = new THREE.Group(); g.position.set(x, y, z); scene.add(g);
  const base = new THREE.Mesh(new RoundedBoxGeometry(0.8, 0.5, 0.06, 4, 0.05), clay(0xffffff, 0.5)); base.castShadow = true; g.add(base);
  for (let i = 0; i < 3; i++) { const l = new THREE.Mesh(new RoundedBoxGeometry(i ? 0.42 : 0.55, 0.05, 0.02, 2, 0.02), i ? clay(0xc9d3ea) : AZUL); l.position.set(-0.05 + (i ? -0.06 : 0), 0.12 - i * 0.11, 0.04); g.add(l); }
  tarjetas.push(g);
}

const P = crearPersonaje(); scene.add(P.raiz);

const cam = new THREE.PerspectiveCamera(32, W / H, 0.1, 100);
const ease = t => t <= 0 ? 0 : t >= 1 ? 1 : t * t * (3 - 2 * t);
const k = (t, a, d) => Math.max(0, Math.min(1, (t - a) / d));

function draw(t) {
  // personaje: entra caminando, frena, saluda y señala la puerta
  P.reset();
  const avanza = ease(k(t, 0, 2.2));
  P.raiz.position.set(-3.2 + avanza * 2.6, 0, 0.9);
  P.raiz.rotation.y = 0.9 * (1 - ease(k(t, 1.9, 0.5))) + 0.25 * ease(k(t, 1.9, 0.5));
  if (t < 2.3) P.caminar(t, 1, 1 - k(t, 2.0, 0.3));
  P.respirar(t); P.parpadear(t);
  if (t > 2.3 && t < 3.6) P.saludar(t, ease(k(t, 2.3, 0.3)) * (1 - ease(k(t, 3.3, 0.3))));
  if (t >= 3.6) P.señalar(ease(k(t, 3.6, 0.35)), 1);
  // la puerta se abre cuando la señala
  bisagra.rotation.y = -1.2 * ease(k(t, 3.9, 0.9));
  tarjetas.forEach((g, i) => { g.position.y = [2.4, 2.1][i] + Math.sin(t * 1.6 + i) * 0.05; g.rotation.y = -0.3 + i * 0.5 + Math.sin(t * 0.8 + i) * 0.06; });
  // cámara: traveling lateral + acercamiento suave, en perspectiva
  const c = ease(k(t, 0, 5));
  cam.position.set(-1.8 + c * 2.2, 2.3 - c * 0.4, 10.5 - c * 2.2);
  cam.lookAt(-0.3 + c * 0.6, 1.15, -0.3);
  renderer.render(scene, cam);
}
window.ready = Promise.resolve();
window.frameJPEG = t => { draw(t); return renderer.domElement.toDataURL('image/jpeg', 0.92); };
</script></body></html>
